name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

# A new commit on the same branch cancels the run for the older one
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        # Throwaway database for the tests that need real MySQL
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: cmms
                    MYSQL_DATABASE: cmms_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -pcmms"
                    --health-interval 5s --health-timeout 5s --health-retries 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - run: npm ci
            - run: npm test
              env:
                  DB_HOST: 127.0.0.1
                  DB_PASSWORD: cmms
                  DB_NAME: cmms_test

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            # Without --no-fix the lint script rewrites files and passes
            - run: npm run lint -- --no-fix
            - run: npm run build

    browser:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker compose up --build -d
            - name: Wait for the API
              run: |
                  for i in $(seq 1 60); do
                      curl -s -o /dev/null http://localhost:8080/api/events && exit 0
                      sleep 5
                  done
                  echo "API did not answer within 5 minutes"
                  exit 1
            - run: tests/browser/run.sh
            - if: failure()
              run: docker compose logs
