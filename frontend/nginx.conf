server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS; resolving per request means nginx still starts
  # if the backend container isn't up yet.
  resolver 127.0.0.11 valid=10s;

  # API calls go to the backend container
  location /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    client_max_body_size 20m;
  }

  # Vue router uses history mode, so unknown paths serve the app
  location / {
    try_files $uri $uri/ /index.html;
  }
}
