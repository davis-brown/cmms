server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS; resolving per request means nginx still starts
  # if the backend container isn't up yet.
  resolver 127.0.0.11 valid=10s;

  # API calls go to the backend container
  location /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    # Lets the backend's rate limits see each visitor's address
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 20m;
  }

  # Vue router uses history mode, so unknown paths serve the app
  location / {
    # API responses get these from helmet in the backend
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ /index.html;
  }
}
